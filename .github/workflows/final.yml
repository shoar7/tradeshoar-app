name: Build TradeShoar Official

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Full Android App
        run: |
          # Create complete fresh flutter project
          flutter create --org com.tradeshoar --project-name tradeshoar trade_app
          cd trade_app

          # Write complete UI code
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: TradeShoarHome(),
            ));
          }

          class TradeShoarHome extends StatelessWidget {
            const TradeShoarHome({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  title: const Text('TradeShoar | ترید شار', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [Color(0xFF10B981), Color(0xFF059669)],
                        ),
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: const Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text("موجودی کل حساب (تتر)", style: TextStyle(color: Colors.white70, fontSize: 14)),
                          SizedBox(height: 8),
                          Text("\$25,480.00", style: TextStyle(color: Colors.white, fontSize: 30, fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                    const SizedBox(height: 24),
                    const Text("قیمت‌های لحظه‌ای بازار", style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 12),
                    Expanded(
                      child: ListView(
                        children: const [
                          MarketCard(name: "Bitcoin (BTC)", price: "\$64,250", change: "+2.4%", isUp: true),
                          MarketCard(name: "Ethereum (ETH)", price: "\$3,480", change: "+1.2%", isUp: true),
                          MarketCard(name: "Solana (SOL)", price: "\$145.2", change: "-0.8%", isUp: false),
                          MarketCard(name: "Tether (USDT)", price: "61,500 Toman", change: "0.0%", isUp: true),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class MarketCard extends StatelessWidget {
            final String name;
            final String price;
            final String change;
            final bool isUp;

            const MarketCard({super.key, required this.name, required this.price, required this.change, required this.isUp});

            @override
            Widget build(BuildContext context) {
              return Card(
                color: const Color(0xFF1E293B),
                margin: const EdgeInsets.only(bottom: 12),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                child: ListTile(
                  title: Text(name, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  trailing: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    crossAxisAlignment: CrossAxisAlignment.end,
                    children: [
                      Text(price, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                      Text(change, style: TextStyle(color: isUp ? const Color(0xFF10B981) : Colors.red, fontSize: 12)),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # Build APK
          flutter build apk --release

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeShoar-Launcher-APK
          path: trade_app/build/app/outputs/flutter-apk/app-release.apk
