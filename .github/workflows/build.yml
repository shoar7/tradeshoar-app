name: Build TradeShar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create and Setup App Project
        run: |
          rm -rf tradeshar_app
          flutter create --org com.tradeshar --project-name tradeshar_app tradeshar_app
          cd tradeshar_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeShar-APK-Ready
          path: tradeshar_app/build/app/outputs/flutter-apk/app-release.apk
